name: CI Test Matrix & Quality Gates

on:
  push:
    branches: [ main, master, "feature/**", "fix/**" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies & Package
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          pip install pytest pytest-cov flake8
          pip install -e . || pip install . || true

      - name: Lint with Flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.git,__pycache__,dist,build
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=140 --statistics --exclude=.git,__pycache__,dist,build

      - name: Run Test Suite with Coverage
        env:
          PYTHONPATH: src
        run: |
          pytest tests/ -v --cov=subsweep_lead_scanner --cov-report=xml --cov-report=term || pytest tests/ -v

      - name: Smoke Test Reference Examples
        env:
          PYTHONPATH: src
        run: |
          python examples/domain-recon-audit/run_audit.py --domain acme-cloud.io --format text
          python examples/domain-recon-audit/run_audit.py --domain acme-cloud.io --format markdown --output test_audit.md
          python examples/lead-generation-pipeline/export_leads.py --min-score 80 --format text
          python examples/lead-generation-pipeline/export_leads.py --format json --output test_leads.json

      - name: Verify Package Build Smoke
        run: |
          python -m build --sdist --wheel
